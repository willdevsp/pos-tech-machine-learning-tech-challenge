name: Training Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'training/**'
      - 'shared/**'
      - '.github/workflows/train.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'training/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov dvc
          cd shared && pip install -e .
          cd ../training && pip install -e .
      - name: Lint with Ruff
        run: ruff check training/
      - name: Run pytest
        run: cd training && pytest tests/ -v --cov=src
      - name: Test DVC pipeline
        run: cd training && dvc dag --check
