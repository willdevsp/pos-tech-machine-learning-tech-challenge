[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-tail-api"
version = "1.0.0"
description = "REST API service for RocketTail recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rocket-tail-shared",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
