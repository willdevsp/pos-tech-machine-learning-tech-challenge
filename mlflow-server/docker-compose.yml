services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: always

volumes:
  mlflow_data:
